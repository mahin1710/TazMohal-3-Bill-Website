<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Monthly Summary - TazMohal-3</title>
<link rel="stylesheet" href="styles.css"/>
<script src="xlsx.full.min.js"></script>
</head>
<body>
<header>
<h1>TazMohal-3</h1>
<p>Monthly Rent & Electricity Billing Summary</p>
<button id="themeToggle">🌙</button>
<div class="month-select">
<label>Select Month:</label>
<input type="month" id="monthSelector" onchange="populateSummary()"/>
</div>
</header>

<main class="container">
<h2>Monthly Billing Summary Report</h2>
<div class="actions" style="text-align: left; margin-bottom: 20px;">
<button onclick="window.location.href='index.html'">🏠 Rent Calculator (Pay Bill)</button>
<button onclick="window.location.href='paid-bill.html'" style="background:#00796b;">💰 Paid Bill Management</button>
<button onclick="window.location.href='details.html'">⚡ Electricity Details</button>
<button onclick="downloadSummaryExcel()" style="background:#2e7d32;">📥 Download Monthly Excel</button>
</div>

<table class="summary-table">
<thead>
<tr>
<th>Flat</th><th>Electricity Bill</th><th>House Rent</th><th>Previous Due</th><th>Total Payable</th><th>Amount Paid</th><th>Remaining Due</th><th>Status</th>
</tr>
</thead>
<tbody id="summary-body">
<tr><td colspan="8">Please select a month</td></tr>
</tbody>
<tfoot id="summary-foot" style="font-weight:bold; background:#e0f2f1;">
</tfoot>
</table>
</main>

<script>
let currentSummaryData = null;

async function populateSummary(){
  const month = document.getElementById('monthSelector').value;
  const tbody = document.getElementById('summary-body');
  const tfoot = document.getElementById('summary-foot');
  tbody.innerHTML = '';
  tfoot.innerHTML = '';
  if (!month) { tbody.innerHTML = '<tr><td colspan="8">Please select a month</td></tr>'; return; }

  try {
    const res = await fetch(`/api/billing/month/${month}`);
    if (res.ok) {
      const json = await res.json();
      currentSummaryData = json;
      renderSummaryRows(json);
      return;
    }
  } catch (e) {}

  // Fallback to localStorage
  const local = JSON.parse(localStorage.getItem('rent_' + month)) || [];
  if (!local.length) { tbody.innerHTML = '<tr><td colspan="8">No data found for this month</td></tr>'; return; }

  let sumElec = 0, sumRent = 0, sumDue = 0, sumTotal = 0;
  local.forEach(f => {
    sumElec += Number(f.electricBill) || 0;
    sumRent += Number(f.rent) || 0;
    sumDue += Number(f.due) || 0;
    sumTotal += Number(f.total) || 0;

    const row = document.createElement('tr');
    row.innerHTML = `
      <td><strong>Flat ${f.flat}</strong></td>
      <td>${(Number(f.electricBill) || 0).toFixed(2)}</td>
      <td>${(Number(f.rent) || 0).toFixed(2)}</td>
      <td>${(Number(f.due) || 0).toFixed(2)}</td>
      <td><strong>${(Number(f.total) || 0).toFixed(2)}</strong></td>
      <td>0.00</td>
      <td>${(Number(f.total) || 0).toFixed(2)}</td>
      <td><span class="badge badge-unpaid">UNPAID</span></td>
    `;
    tbody.appendChild(row);
  });

  tfoot.innerHTML = `
    <tr>
      <td>TOTAL</td>
      <td>${sumElec.toFixed(2)}</td>
      <td>${sumRent.toFixed(2)}</td>
      <td>${sumDue.toFixed(2)}</td>
      <td>${sumTotal.toFixed(2)}</td>
      <td>0.00</td>
      <td>${sumTotal.toFixed(2)}</td>
      <td>-</td>
    </tr>
  `;
}

function renderSummaryRows(data) {
  const tbody = document.getElementById('summary-body');
  const tfoot = document.getElementById('summary-foot');
  tbody.innerHTML = '';
  tfoot.innerHTML = '';

  data.flats.forEach(f => {
    let badgeClass = 'badge-unpaid';
    if (f.payment_status === 'PAID') badgeClass = 'badge-paid';
    else if (f.payment_status === 'PARTIALLY PAID') badgeClass = 'badge-partial';

    const row = document.createElement('tr');
    row.innerHTML = `
      <td><strong>${f.flat_name || 'Flat ' + f.flat_number}</strong></td>
      <td>${Number(f.electricity_bill || 0).toFixed(2)}</td>
      <td>${Number(f.house_rent || 0).toFixed(2)}</td>
      <td>${Number(f.due_amount || 0).toFixed(2)}</td>
      <td><strong>${Number(f.total_payable || 0).toFixed(2)}</strong></td>
      <td style="color:#2e7d32;">${Number(f.amount_paid || 0).toFixed(2)}</td>
      <td style="color:#d32f2f;">${Number(f.remaining_due || 0).toFixed(2)}</td>
      <td><span class="badge ${badgeClass}">${f.payment_status || 'UNPAID'}</span></td>
    `;
    tbody.appendChild(row);
  });

  const s = data.summary;
  tfoot.innerHTML = `
    <tr>
      <td>TOTAL</td>
      <td>${(s.totalElectricity || 0).toFixed(2)}</td>
      <td>${(s.totalHouseRent || 0).toFixed(2)}</td>
      <td>${(s.totalDue || 0).toFixed(2)}</td>
      <td><strong>${(s.totalPayable || 0).toFixed(2)}</strong></td>
      <td style="color:#2e7d32;"><strong>${(s.totalPaid || 0).toFixed(2)}</strong></td>
      <td style="color:#d32f2f;"><strong>${(s.totalOutstanding || 0).toFixed(2)}</strong></td>
      <td>-</td>
    </tr>
  `;
}

function downloadSummaryExcel(){
  const month = document.getElementById('monthSelector').value;
  if (!month) { alert('Select a month!'); return; }
  const table = document.querySelector('table');
  const wb = XLSX.utils.table_to_book(table, { sheet: 'Summary Report' });
  XLSX.writeFile(wb, `TazMohal3_Summary_${month}.xlsx`);
}

// Theme toggle
const toggleBtn = document.getElementById('themeToggle');
if (toggleBtn) {
  toggleBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
  });
}

window.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
  }
  const monthInput = document.getElementById('monthSelector');
  const saved = localStorage.getItem('selected_month');
  if (saved) {
    monthInput.value = saved;
  } else {
    const now = new Date();
    monthInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  }
  populateSummary();
});
</script>
</body>
</html>
