<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Electricity Bill Details - TazMohal-3</title>
<link rel="stylesheet" href="styles.css"/>
<script src="xlsx.full.min.js"></script>
</head>
<body>
<header>
<h1>TazMohal-3</h1>
<p>Uttarkhan, Uttara, Dhaka-1230</p>
<button id="themeToggle">🌙</button>
<div class="month-select">
<label>Select Month:</label>
<input type="month" id="monthSelector" onchange="populateDetails()"/>
</div>
</header>

<main class="container">
<h2>Detailed Electricity Bill Breakdown</h2>
<div class="actions">
<button onclick="window.location.href='index.html'">🏠 Rent Calculator</button>
<button onclick="window.location.href='summary.html'">📊 View Summary</button>
<button onclick="window.location.href='paid-bill.html'" style="background:#00796b;">💰 Paid Bill</button>
<button onclick="downloadDetailsExcel()">📥 Download Excel</button>
</div>

<table>
<thead>
<tr>
<th>Flat</th><th>Previous Reading</th><th>Current Reading</th><th>Units Used</th><th>Unit Charge (৳10)</th><th>Meter Charge (৳60)</th><th>Total Electricity Bill (৳)</th>
</tr>
</thead>
<tbody id="details-body">
<tr><td colspan="7">Please select a month</td></tr>
</tbody>
</table>
</main>

<script>
async function populateDetails(){
  const month = document.getElementById('monthSelector').value;
  const tbody = document.getElementById('details-body');
  tbody.innerHTML = '';
  if (!month) { tbody.innerHTML = '<tr><td colspan="7">Please select a month</td></tr>'; return; }

  let flatsData = [];
  try {
    const res = await fetch(`/api/billing/month/${month}`);
    if (res.ok) {
      const json = await res.json();
      if (json && Array.isArray(json.flats)) {
        flatsData = json.flats.map(f => ({
          flat: f.flat_name || `Flat ${f.flat_number}`,
          previous: Number(f.previous_reading) || 0,
          current: Number(f.current_reading) || 0,
          units: Number(f.units_used) || 0,
          electricBill: Number(f.electricity_bill) || 0
        }));
      }
    }
  } catch (e) {}

  if (!flatsData.length) {
    const local = JSON.parse(localStorage.getItem('rent_' + month)) || [];
    flatsData = local.map(f => ({
      flat: `Flat ${f.flat}`,
      previous: Number(f.previous) || 0,
      current: Number(f.current) || 0,
      units: Number(f.units) || 0,
      electricBill: Number(f.electricBill) || 0
    }));
  }

  if (!flatsData.length) { tbody.innerHTML = '<tr><td colspan="7">No data found for this month</td></tr>'; return; }

  flatsData.forEach(flat => {
    const row = document.createElement('tr');
    row.innerHTML = `<td><strong>${flat.flat}</strong></td><td>${flat.previous.toFixed(2)}</td><td>${flat.current.toFixed(2)}</td><td>${flat.units.toFixed(2)}</td><td>${(flat.units * 10).toFixed(2)}</td><td>60.00</td><td><strong>${flat.electricBill.toFixed(2)}</strong></td>`;
    tbody.appendChild(row);
  });
}

function downloadDetailsExcel(){
  const month = document.getElementById('monthSelector').value;
  if (!month) { alert('Select a month!'); return; }
  const table = document.querySelector('table');
  const wb = XLSX.utils.table_to_book(table, { sheet: 'Electricity Details' });
  XLSX.writeFile(wb, `TazMohal3_Details_${month}.xlsx`);
}

// Theme toggle
const toggleBtn = document.getElementById('themeToggle');
if (toggleBtn) {
  toggleBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
  });
}

window.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
  }
  const monthInput = document.getElementById('monthSelector');
  const saved = localStorage.getItem('selected_month');
  if (saved) {
    monthInput.value = saved;
  } else {
    const now = new Date();
    monthInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  }
  populateDetails();
});
</script>
</body>
</html>
