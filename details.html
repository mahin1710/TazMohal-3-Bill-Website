<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Electricity Bill Details - TazMohal-3</title>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<header>
<h1>TazMohal-3</h1>
<p>Uttarkhan, Uttara, Dhaka-1230</p>
<div class="month-select">
<label>Select Month:</label>
<input type="month" id="monthSelector" onchange="populateDetails()"/>
</div>
</header>

<main class="container">
<h2>Detailed Electricity Bill Breakdown</h2>
<div class="actions">
<button onclick="window.location.href='summary.html'">⬅ Back to Summary</button>
<button onclick="downloadDetailsExcel()">Download Excel</button>
</div>

<table>
<thead>
<tr>
<th>Flat</th><th>Previous</th><th>Current</th><th>Units Used</th><th>Unit Charge</th><th>Meter Charge</th><th>Total (/=)</th>
</tr>
</thead>
<tbody id="details-body">
<tr><td colspan="7">Please select a month</td></tr>
</tbody>
</table>
</main>

<script>
function populateDetails(){
  const month=document.getElementById('monthSelector').value;
  const tbody=document.getElementById('details-body');
  tbody.innerHTML='';
  if(!month){ tbody.innerHTML='<tr><td colspan="7">Please select a month</td></tr>'; return; }
  const data=JSON.parse(localStorage.getItem("rent_"+month))||[];
  if(!data.length){ tbody.innerHTML='<tr><td colspan="7">No data found</td></tr>'; return; }
  data.forEach(flat=>{
    const row=document.createElement('tr');
    row.innerHTML=`<td>${flat.flat}</td><td>${flat.previous.toFixed(2)}</td><td>${flat.current.toFixed(2)}</td><td>${flat.units.toFixed(2)}</td><td>${(flat.units*10).toFixed(2)}</td><td>60.00</td><td>${flat.electricBill.toFixed(2)}</td>`;
    tbody.appendChild(row);
  });
}

function downloadDetailsExcel(){
  const month=document.getElementById('monthSelector').value;
  if(!month){ alert("Select a month!"); return; }
  const data=JSON.parse(localStorage.getItem("rent_"+month))||[];
  if(!data.length){ alert("No data for this month"); return; }
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Details");
  XLSX.writeFile(wb,"TazMohal3_Details_"+month+".xlsx");
}
</script>
</body>
</html>
